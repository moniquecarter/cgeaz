name: compliance-gate

# The pipeline enforces policy on your environment. This gate enforces policy on the
# pipeline. No governance change merges without passing the same kind of scrutiny the
# pipeline applies to everything else.

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC federation — no client secret stored in GitHub, nothing to rotate
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
  TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}

jobs:
  gate:
    # Runs only in forks that have been armed (Lab 6: labs/06-loop/arm-your-fork.sh).
    # The upstream GRCEngClub/cgeaz repo is deliberately NOT armed: on a public repo,
    # a pull_request OIDC subject matches PRs from any fork — arming upstream would
    # hand fork PRs a path toward the course subscription. Your fork, your identity,
    # your sandbox subscription only.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [01-foundation, 03-evidence-store, 04-reporting, 06-enforcement]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # backend.hcl is gitignored (bootstrap.sh writes it locally), so the runner
      # rebuilds it from the fork's own repository variable.
      - name: backend config from repository variables
        run: |
          printf 'resource_group_name  = "rg-grc-tfstate"\nstorage_account_name = "%s"\ncontainer_name       = "tfstate"\n' \
            "$TF_VAR_state_storage_account" > labs/03-foundation/backend.hcl

      - name: terraform validate + plan
        working-directory: stages/${{ matrix.stage }}
        run: |
          terraform init -input=false -backend-config=../../labs/03-foundation/backend.hcl
          terraform validate
          terraform plan -input=false -out=tf.plan
          terraform show -json tf.plan > plan.json

      # Pinned conftest + checksum, instead of instrumenta/conftest-action@master: that action
      # bundles an OPA older than 0.59 that can't parse `import rego.v1`, and an unpinned
      # @master is a supply-chain risk. 0.71.1 (OPA 1.21.1) matches local validation.
      - name: OPA gate (conftest 0.71.1, pinned)
        run: |
          curl -sSfL -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  conftest.tar.gz" | sha256sum -c -
          tar -xzf conftest.tar.gz conftest
          ./conftest test stages/${{ matrix.stage }}/plan.json -p policy
